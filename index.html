<!DOCTYPE html>
<!-- build: 20260922-5 （公開中の版を確認するための目印） -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FULL CREW | チーム記録ツール</title>
<meta name="theme-color" content="#0d0a09">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='36' fill='%230d0a09'/%3E%3Ccircle cx='96' cy='96' r='58' fill='none' stroke='%23f0764a' stroke-width='10'/%3E%3Cpath d='M96 50v46l32 20' fill='none' stroke='%23f0764a' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0a09; --bg2:#14100e; --card:#1a1513; --card2:#211a17;
    --line:#2e2521; --line2:#3d322c;
    --accent:#f0764a; --accent-dim:#c9552f; --accent-soft:rgba(240,118,74,.12);
    --text:#ede8e4; --muted:#9a8f88; --dim:#6d635d;
    --ok:#4ec9a0; --warn:#e8b44a; --bad:#e8654a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
    padding:0 0 80px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 20px}
  a{color:var(--accent)}

  /* ---------- demo banner ---------- */
  .demo-banner{
    background:var(--warn);color:#241a06;padding:10px 16px;font-size:12.5px;
    text-align:center;font-weight:700;
  }
  .demo-banner a{color:#241a06;text-decoration:underline}

  /* ---------- header ---------- */
  header{
    background:linear-gradient(160deg,#1d1512 0%,var(--bg) 70%);
    border-top:3px solid var(--accent);
    padding:30px 0 24px; margin-bottom:28px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    color:var(--accent); font-size:11px; font-weight:700;
    letter-spacing:.18em; margin-bottom:10px;
  }
  h1{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  h1 .the{display:block;font-size:18px;color:var(--dim);letter-spacing:.05em}
  h1 .full{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:10px}
  .countdown{
    display:inline-block;margin-top:14px;padding:6px 14px;
    background:var(--accent-soft);border:1px solid var(--accent-dim);
    border-radius:100px;font-size:13px;font-weight:700;color:var(--accent);
  }
  .userbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:8px;
  }
  .userbar b{color:var(--text)}
  .userbar button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:12.5px;padding:0}

  /* ---------- badge ---------- */
  .badge{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.03em}
  .badge.member{background:var(--card2);color:var(--muted);border:1px solid var(--line2)}

  /* ---------- tabs ---------- */
  .tabbar{display:flex;gap:22px;margin-bottom:24px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{padding:0 0 11px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* ---------- section / card ---------- */
  section{margin-bottom:34px}
  h2{
    font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--accent);
    padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:22px;margin-bottom:14px;
  }
  .card h3{font-size:15px;font-weight:700;margin-bottom:4px}
  .colItem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:13px 18px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
  .colItem:last-child{border-bottom:none}
  .colDate{flex:0 0 44px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .colTitle{flex:1 1 auto;font-size:14px;font-weight:600;line-height:1.5}
  .colArrow{flex:0 0 auto;color:var(--muted);font-size:18px}
  /* ホーム（案C：上に帯、よく使う4つはタイル） */
  .home{display:flex;flex-direction:column;gap:12px}
  .homeBand{background:var(--card2);border:1px solid var(--accent-dim);border-radius:16px;padding:18px 18px 16px}
  .hbTop{font-size:13px;font-weight:700;color:var(--muted)}
  .hbTop b{font-size:40px;font-weight:800;color:var(--accent);margin:0 4px;letter-spacing:-.02em;line-height:1}
  .hbRace{font-size:12px;color:var(--muted);margin-top:4px}
  .hbMine{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--text)}
  .hbMine b{font-size:22px;color:var(--text)}
  .tileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:118px;color:var(--text);font:inherit;cursor:pointer}
  .tile:hover{border-color:var(--line2)}
  .tileIco{display:flex;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center;margin-bottom:6px}
  .tileIco .ico{width:22px;height:22px}
  .tileTitle{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
  .tileSub{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .homeRow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .homeRow > .ico{width:26px;height:26px;color:var(--accent);flex:0 0 auto}
  .hrLabel{font-size:11.5px;font-weight:700;color:var(--muted)}
  .hrTitle{font-size:15px;font-weight:700;margin-top:2px}
  .hrSub{font-size:12px;color:var(--muted)}
  .newBadge{font-size:10px;font-weight:800;letter-spacing:.06em;color:#180d08;background:var(--accent);border-radius:99px;padding:2px 7px}
  /* 名前を選ぶ画面・誰として記録しているか */
  .pickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pickBtn{background:var(--card);border:1px solid var(--line2);color:var(--text);border-radius:14px;padding:18px 10px;font-size:15px;font-weight:700}
  .pickBtn:hover{border-color:var(--accent)}
  .whoBar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:14px}
  .whoBar span{font-weight:700;color:var(--text)}
  .hbMine.link{cursor:pointer;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
  .hbArrow{margin-left:auto;font-size:12px;color:var(--accent)}
  .youBadge{font-size:10.5px;font-weight:800;color:#180d08;background:var(--accent);border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
  .memberRow.me{border-color:var(--accent-dim)}
  /* タブのアイコン */
  .tab .ico{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
  /* 資料タブの別サイト（埋め込み） */
  .embedHead{text-align:right;font-size:12px;margin:-4px 0 6px}
  .embedWrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .embedWrap iframe{display:block;width:100%;height:70vh;border:0}
  body.embedMode footer{display:none}
  body.embedMode{overflow:hidden}
  /* （旧）説明＋開くボタン */
  .siteCard{margin-bottom:26px}
  .siteDesc{font-size:14px;color:var(--muted);margin:6px 0 16px;line-height:1.8}
  .siteOpen{display:inline-block;background:var(--accent);color:#180d08;font-weight:800;text-decoration:none;border-radius:12px;padding:12px 22px;font-size:14px}
  /* （旧）外部サイトへのリンク */
  .linkCard{padding:6px 0;margin-bottom:26px}
  .linkCardTitle{font-size:11.5px;font-weight:700;color:var(--muted);padding:10px 18px 4px}
  .extLink{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-top:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px;font-weight:600}
  .extLink:first-of-type{border-top:none}
  .extArrow{color:var(--muted)}
  .colText{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.85;margin-top:14px;color:var(--text)}
  .colText a{word-break:break-all}
  .colFigLabel{font-size:12px;color:var(--muted);font-weight:700;margin:18px 0 6px}
  .card .note{color:var(--muted);font-size:12.5px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.08em}
  th.num,td.num{text-align:right}
  td.num{font-variant-numeric:tabular-nums}

  /* ---------- monthly tabs ---------- */
  .monthTabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
  .monthTab{background:var(--card2);color:var(--muted);border:1px solid var(--line2);padding:6px 14px;border-radius:100px;font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0}
  .monthTab.active{background:var(--accent);color:#180d08;border-color:var(--accent)}
  .monthSummary{font-size:13px;color:var(--muted);margin-bottom:14px}
  .monthSummary b{color:var(--text);font-variant-numeric:tabular-nums}

  /* ---------- forms ---------- */
  label{display:block;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.06em;margin-bottom:5px}
  input,select,textarea{
    width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--text);
    padding:9px 11px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:64px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .field{margin-bottom:14px}
  .grid{display:grid;gap:12px}
  /* グリッドの子は既定だと中身より小さくなれないため、iOSの日付欄などが
     枠をはみ出して隣の欄と重なる。min-width:0 で必ず枠内に収める */
  .grid > div{min-width:0}
  input,select,textarea{max-width:100%}
  /* iOS Safari の日付欄は既定の見た目のままだと中身の幅より小さくならず、
     枠を突き抜けて隣の欄に重なる。ネイティブ装飾を外して幅を固定する */
  input[type=date]{
    -webkit-appearance:none;appearance:none;
    width:100%;min-width:0;display:block;
  }
  .g2{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:620px){.g4{grid-template-columns:1fr 1fr}}
  button{
    background:var(--accent);color:#180d08;border:0;padding:10px 20px;border-radius:8px;
    font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  button:hover{background:#ff8759}
  button.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted)}
  button.ghost:hover{background:var(--card2);color:var(--text)}
  button.tiny{padding:3px 9px;font-size:11px}
  button:disabled{opacity:.5;cursor:not-allowed}

  .msg{padding:11px 14px;border-radius:8px;font-size:13px;margin-top:12px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(78,201,160,.1);border:1px solid rgba(78,201,160,.35);color:var(--ok)}
  .msg.err{background:rgba(232,101,74,.1);border:1px solid rgba(232,101,74,.35);color:var(--bad)}

  .empty{text-align:center;color:var(--dim);padding:26px;font-size:13px}
  footer{text-align:center;color:var(--dim);font-size:11.5px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}

  /* ---------- 折りたたみ（大会設定など） ---------- */

  /* ---------- みんなの状況（人別の一覧） ---------- */
  .memberRow{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:13px 16px;margin-bottom:8px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-weight:400;
  }
  .memberRow:hover{background:var(--card2);border-color:var(--line2)}
  .memberRow .mrMain{flex:1;min-width:0}
  .memberRow .mrName{display:block;font-size:14.5px;font-weight:700}
  .memberRow .mrLast{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
  .memberRow .mrKm{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .memberRow .mrKm small{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
  .memberRow .mrChev{color:var(--dim);font-size:17px;line-height:1}
  .memberRow.empty .mrName{color:var(--muted);font-weight:600}
  .memberRow.empty .mrKm{color:var(--dim);font-weight:600}

  .recTable .unit{font-size:11px;color:var(--muted);font-weight:400}

  /* ============================================================
     モバイル最適化（スマホでの利用がメイン）
     ============================================================ */
  @media(max-width:620px){
    /* --- ヘッダーを圧縮して、開いてすぐ中身が見えるように --- */
    header{padding:14px 0 12px;margin-bottom:16px}
    .eyebrow{display:none}
    h1{font-size:20px}
    h1 .the{display:inline;font-size:20px;color:var(--dim);letter-spacing:0;margin-right:6px}
    .countdown{margin-top:8px;padding:5px 12px;font-size:12px}
    .userbar{margin-top:10px;padding-top:10px;font-size:12px}
    /* 未ログイン時の「あなたは？[名前][入る]」を1行に収める */
    .userbar select{flex:1;min-width:0;font-size:14px;padding:8px 10px}
    .userbar button{white-space:nowrap}
    h2{font-size:12px;padding-bottom:8px;margin-bottom:14px}
    .wrap{padding:0 16px}
    section{margin-bottom:24px}
    .card{padding:16px;border-radius:10px}

    /* --- タブバーは画面下端に固定（親指で届く位置） ---
       iPhoneのホームバー部分（safe-area）の分だけ下に余白を取る --- */
    .tabbar{
      position:fixed;left:0;right:0;bottom:0;z-index:50;
      margin:0;gap:4px;overflow:visible;
      background:var(--bg2);
      border:0;border-top:1px solid var(--line2);border-radius:0;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 20px rgba(0,0,0,.5);
    }
    .tabbar .tab{
      flex:1;padding:10px 2px;font-size:11px;border-bottom:0;border-radius:10px;
      line-height:1.3;
    }
    .tabbar .tab.active{background:var(--accent-soft);border-bottom-color:transparent}
    .tabbar .tab .ico{display:block;width:22px;height:22px;margin:0 auto 3px}
    .tabbar .tab{padding:7px 2px 6px;font-size:10.5px}
    body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}

    /* --- ヘッダーの「ようこそ／さん」はモバイルでは省いて、
           「別の人に切り替える」が見切れないようにする --- */
    .greet{display:none}
    .whoami{display:flex;align-items:center;gap:6px;min-width:0}
    .whoami b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* --- 入力欄：iOSで自動ズームしないよう16px以上にする --- */
    input,select,textarea{font-size:16px;padding:10px 12px}
    /* iOSの日付欄は幅が縮まないため、スマホでは1行まるごと使う
       （隣に欄を置かなければ重なりようがない） */
    .g4 > .dateField{grid-column:1 / -1}
    .dateField input{text-align:left}
    button{padding:12px 18px}
    button.tiny{padding:8px 12px;font-size:12px}
    label{font-size:10.5px}

    /* --- 記録一覧：表を横スクロールさせず、1件=1カードに積む --- */
    .recTable thead{display:none}
    .recTable,.recTable tbody,.recTable tr,.recTable td{display:block;width:100%}
    .recTable tr.recRow{
      border:1px solid var(--line);border-radius:10px;background:var(--card2);
      padding:12px 14px;margin-bottom:10px;
      display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:baseline;
    }
    .recTable tr.recRow td{border:0;padding:0}
    .recTable td.cDate{font-size:15px;font-weight:700}
    .recTable td.cDist{text-align:right;font-size:17px;font-weight:800}
    .recTable td.cSub{font-size:13px;color:var(--muted);text-align:left}
    .recTable td.cSub::before{
      content:attr(data-label);display:block;color:var(--dim);
      font-size:10px;font-weight:700;letter-spacing:.06em;margin-bottom:1px;
    }
    .recTable td.cActions{grid-column:1/3;display:flex;gap:8px;margin-top:4px}
    .recTable td.cActions button{flex:1}
    .recTable tr.detailRow{margin:-11px 0 12px}
    .recTable tr.detailRow td{
      border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;
      background:var(--bg2);padding:12px 14px;
    }

    /* --- みんなの状況（人別の一覧） --- */
    .memberRow{padding:12px 14px;gap:10px}
    .memberRow .mrName{font-size:14px}

    /* --- ガイドの埋め込み --- */
    .monthTabs{gap:6px}
    .monthTab{padding:7px 9px;font-size:12px}
    /* ガイドのボタンは5つあるので、スマホでは少し詰めて1行に収める */
    .guideTabs{gap:4px}
    .guideTabs .monthTab{padding:7px 6px;font-size:11.5px}
  }
</style>
</head>
<body>
<div id="demoBanner"></div>
<div id="app"></div>

<script src="config.js"></script>
<script src="columns.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   バックエンド（データの保存先）を切り替える仕組み
   ・config.js に本物のSupabase情報が入っていれば → Supabaseを使う（全員で共有）
   ・入っていなければ → この端末のブラウザだけに保存する「デモモード」
   ============================================================ */
var DEMO_MODE = (typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0);

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function currentMonthKey(){ return todayStr().slice(0, 7); }
// 今週の月曜日（YYYY-MM-DD）。宿題の週と同じく月曜はじまりで数える
function weekStartStr(){
  var d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 「2026-09-21」でも「20260921」でも、今日から何日前かを返す
function daysAgo(dateStr){
  var s = String(dateStr).replace(/-/g,'');
  var d = new Date(Number(s.slice(0,4)), Number(s.slice(4,6))-1, Number(s.slice(6,8)));
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - d) / 86400000);
}
// 配信から7日以内なら「NEW」を付ける
function newBadge(dateStr){ var n = daysAgo(dateStr); return (n >= 0 && n <= 6) ? '<span class="newBadge">NEW</span>' : ''; }
var WEEKDAYS = ['日','月','火','水','木','金','土'];
function parseDurationToSec(s){
  var parts = String(s||'').trim().split(':').map(Number);
  if(!parts.length || parts.some(isNaN)) return null;
  if(parts.length === 2) return parts[0]*60 + parts[1];
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return null;
}
/* 打ち間違いっぽい値を見つける（保存前に確認を出すため。保存自体は止めない） */
function unusualValueWarnings(v){
  var w = [];
  if(v.date > todayStr()) w.push('日付が未来になっています（' + v.date + '）');
  if(v.dist > 50) w.push('距離が ' + v.dist + 'km です（小数点の打ち忘れ？）');
  if(v.dist < 0.5) w.push('距離が ' + v.dist + 'km です');
  if(v.hr < 60 || v.hr > 210) w.push('平均心拍が ' + v.hr + ' です');
  var durSec = parseDurationToSec(v.duration);
  var paceSec = parseDurationToSec(v.pace);
  if(!durSec) w.push('時間「' + v.duration + '」の形が読み取れません（例：52:30 / 1:05:00）');
  if(!paceSec) w.push('ペース「' + v.pace + '」の形が読み取れません（例：5:15）');
  if(paceSec && (paceSec < 150 || paceSec > 1200)) w.push('ペースが 1kmあたり ' + v.pace + ' です');
  if(durSec && paceSec && v.dist > 0){
    var calc = durSec / v.dist;
    if(Math.abs(calc - paceSec) / calc > 0.15){
      w.push('距離と時間から計算したペース（' + formatPace(calc) + '）と、入力したペース（' + v.pace + '）が大きく違います');
    }
  }
  if(v.cadence != null && (v.cadence < 100 || v.cadence > 230)) w.push('ピッチが ' + v.cadence + ' です');
  if(v.gct != null && (v.gct < 150 || v.gct > 400)) w.push('接地時間が ' + v.gct + 'ms です');
  return w;
}
function formatPace(secPerKm){
  var m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  if(s === 60){ m++; s = 0; }
  return m + ':' + String(s).padStart(2,'0');
}

var LocalBackend = (function(){
  var KEY = 'tfc_team_demo_v1';
  function load(){
    try{
      var s = localStorage.getItem(KEY);
      if(s) return JSON.parse(s);
    }catch(e){}
    return {
      members: [],
      records: [],
      raceConfig: { race_name:'第74回 勝田全国マラソン', race_date:'2027-01-31', target_distance_km:42.195 }
    };
  }
  function save(store){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  return {
    async listMembers(){
      var s = load();
      return s.members.map(function(m){ return {id:m.id, name:m.name, role:m.role}; });
    },
    async getMember(id){
      var s = load();
      var m = s.members.find(function(x){ return x.id === id; });
      return m ? {id:m.id, name:m.name, role:m.role} : null;
    },
    async addRecord(memberId, data){
      var s = load();
      var r = Object.assign({id: uid(), member_id: memberId, created_at: new Date().toISOString()}, data);
      s.records.push(r); save(s);
      return r;
    },
    async listMyRecords(memberId){
      var s = load();
      return s.records.filter(function(r){ return r.member_id === memberId; })
        .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    },
    async deleteRecord(id){
      var s = load();
      s.records = s.records.filter(function(r){ return r.id !== id; });
      save(s);
    },
    async updateRecord(id, data){
      var s = load();
      var idx = s.records.findIndex(function(r){ return r.id === id; });
      if(idx >= 0){ s.records[idx] = Object.assign({}, s.records[idx], data); save(s); }
    },
    async getRaceConfig(){
      var s = load();
      return s.raceConfig;
    },
    async setRaceConfig(data){
      var s = load();
      s.raceConfig = Object.assign({}, s.raceConfig, data);
      save(s);
    },
    async teamOverview(){
      var s = load();
      var thisMonth = currentMonthKey();
      var weekStart = weekStartStr();
      return s.members.filter(function(m){ return m.role === 'member'; }).map(function(m){
        var recs = s.records.filter(function(r){ return r.member_id === m.id; })
          .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
        var monthRecs = recs.filter(function(r){ return r.date.slice(0,7) === thisMonth; });
        var weekRecs = recs.filter(function(r){ return r.date >= weekStart; });
        return {
          id: m.id, name: m.name,
          lastDate: recs.length ? recs[0].date : null,
          thisMonthKm: monthRecs.reduce(function(a,r){ return a + Number(r.distance_km||0); }, 0),
          weekKm: weekRecs.reduce(function(a,r){ return a + Number(r.distance_km||0); }, 0),
          weekRuns: weekRecs.length,
          lastMemo: recs.length ? recs[0].memo : '',
          lastRpe: recs.length ? recs[0].rpe : null
        };
      });
    }
  };
})();

var SupabaseBackend = (function(){
  var sb = null;
  function client(){
    if(!sb) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return sb;
  }
  return {
    async listMembers(){
      var r = await client().from('members').select('id,name,role').order('name');
      if(r.error) throw r.error;
      return r.data;
    },
    async getMember(id){
      var r = await client().from('members').select('id,name,role').eq('id', id).single();
      if(r.error) return null;
      return r.data;
    },
    async addRecord(memberId, data){
      var body = Object.assign({member_id: memberId}, data);
      var r = await client().from('records').insert(body).select().single();
      if(r.error) throw r.error;
      return r.data;
    },
    async listMyRecords(memberId){
      var r = await client().from('records').select('*').eq('member_id', memberId).is('deleted_at', null).order('date', {ascending:false});
      if(r.error) throw r.error;
      return r.data;
    },
    async deleteRecord(id){
      // 本当には消さず「削除した日時」を入れて画面から隠す（あとで戻せるように）
      var r = await client().from('records').update({deleted_at: new Date().toISOString()}).eq('id', id);
      if(r.error) throw r.error;
    },
    async updateRecord(id, data){
      var r = await client().from('records').update(data).eq('id', id);
      if(r.error) throw r.error;
    },
    async getRaceConfig(){
      var r = await client().from('race_config').select('*').eq('id',1).single();
      if(r.error) throw r.error;
      return r.data;
    },
    async setRaceConfig(data){
      var r = await client().from('race_config').update(Object.assign({}, data, {updated_at: new Date().toISOString()})).eq('id',1);
      if(r.error) throw r.error;
    },
    async teamOverview(){
      var thisMonth = currentMonthKey();
      var weekStart = weekStartStr();
      var mr = await client().from('members').select('id,name').eq('role','member').order('name');
      if(mr.error) throw mr.error;
      var rr = await client().from('records').select('member_id,date,distance_km,memo,rpe').is('deleted_at', null).order('date', {ascending:false});
      if(rr.error) throw rr.error;
      var byMember = {};
      rr.data.forEach(function(rec){
        (byMember[rec.member_id] = byMember[rec.member_id] || []).push(rec);
      });
      return mr.data.map(function(m){
        var recs = byMember[m.id] || [];
        var monthRecs = recs.filter(function(r){ return r.date.slice(0,7) === thisMonth; });
        var weekRecs = recs.filter(function(r){ return r.date >= weekStart; });
        return {
          id: m.id, name: m.name,
          lastDate: recs.length ? recs[0].date : null,
          thisMonthKm: monthRecs.reduce(function(a,r){ return a + Number(r.distance_km||0); }, 0),
          weekKm: weekRecs.reduce(function(a,r){ return a + Number(r.distance_km||0); }, 0),
          weekRuns: weekRecs.length,
          lastMemo: recs.length ? recs[0].memo : '',
          lastRpe: recs.length ? recs[0].rpe : null
        };
      });
    }
  };
})();

function raceDaysLeft(rc){
  if(!rc || !rc.race_date) return null;
  var p = rc.race_date.split('-');
  var race = new Date(p[0], p[1]-1, p[2]);
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((race - today)/86400000);
}

  // 日付どうしの差で数える（時刻を混ぜると大会当日の朝に「あと1日」と出てしまうため）
  var p = rc.race_date.split('-');
  var race = new Date(p[0], p[1]-1, p[2]);
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((race - today)/86400000);
  var text = days > 0
    ? '🏅 '+esc(rc.race_name)+'まで あと '+days+' 日'
    : days === 0
      ? '🏅 '+esc(rc.race_name)+' 当日・いってらっしゃい！'

  return '<div class="countdown">'+text+'</div>';
}

function linkify(s){

    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';

}

/* ---------------- ホーム（開いたら最初に出る。今週の全体像） ---------------- */
function fmtMDW(dateStr){
  var s = String(dateStr).replace(/-/g,'');
  var d = new Date(Number(s.slice(0,4)), Number(s.slice(4,6))-1, Number(s.slice(6,8)));
  return (d.getMonth()+1)+'/'+d.getDate()+'（'+WEEKDAYS[d.getDay()]+'）';
}
function nextPractice(){
  var today = todayStr();
  return PRACTICES.filter(function(p){ return p.date >= today; })[0] || null;
}

    +     '<div><label>体感・RPE (任意)</label><select id="fRpe"><option value="">—</option>'
    +       Array.from({length:10},function(_,i){ return i+1; }).map(function(n){ return '<option value="'+n+'"'+(editing && Number(editing.rpe)===n ? ' selected' : '')+'>'+n+(n===1?' - とても楽':n===10?' - 全力':'')+'</option>'; }).join('')
    +     '</select></div>'
    +   '</div>'
    +   '<div class="field" style="margin-top:12px"><label>メモ (任意)</label><textarea id="fMemo" placeholder="天候、体調、気づいたことなど">'+esc(editing ? editing.memo : '')+'</textarea></div>'
    +   '<div style="display:flex;gap:10px;margin-top:6px">'

    + '</div></section>';

    $('cancelEditBtn').onclick = function(){

      openMyPage();   // 編集をやめたら、元いた自分の記録ページに戻る
    };
  }

    $('copyLastBtn').onclick = function(){
      $('fDist').value = lastRecord.distance_km;
      $('fDuration').value = lastRecord.duration_text;
      $('fPace').value = lastRecord.pace_text;
      $('fHr').value = lastRecord.heart_rate;
      $('fCadence').value = lastRecord.cadence != null ? lastRecord.cadence : '';
      $('fGct').value = lastRecord.ground_contact_ms != null ? lastRecord.ground_contact_ms : '';
      $('fRpe').value = lastRecord.rpe != null ? lastRecord.rpe : '';
    };
  }

  function maybeAutoPace(){
    if($('fPace').value.trim()) return;
    var dist = parseFloat($('fDist').value);
    var durSec = parseDurationToSec($('fDuration').value);
    if(dist > 0 && durSec > 0){
      $('fPace').value = formatPace(durSec / dist);
    }
  }
  $('fDist').addEventListener('input', maybeAutoPace);
  $('fDuration').addEventListener('input', maybeAutoPace);
  $('fPace').addEventListener('input', function(){ if(!$('fPace').value.trim()) maybeAutoPace(); });

  $('submitBtn').onclick = async function(){
    var dist = parseFloat($('fDist').value);
    var duration = $('fDuration').value.trim();
    var pace = $('fPace').value.trim();
    var hr = parseInt($('fHr').value, 10);
    if(!$('fDate').value || !dist || !duration || !pace || !hr){
      showMsg('inputMsg','err','日付・距離・時間・ペース・平均心拍は必須です。');
      return;
    }
    var warnings = unusualValueWarnings({
      date: $('fDate').value, dist: dist, duration: duration, pace: pace, hr: hr,
      cadence: $('fCadence').value ? parseInt($('fCadence').value,10) : null,
      gct: $('fGct').value ? parseInt($('fGct').value,10) : null
    });
    if(warnings.length && !confirm('入力ミスかもしれない値があります。\n\n・' + warnings.join('\n・') + '\n\nこのまま保存しますか？')) return;
    var data = {
      date: $('fDate').value,
      distance_km: dist,
      duration_text: duration,
      pace_text: pace,
      heart_rate: hr,
      cadence: $('fCadence').value ? parseInt($('fCadence').value,10) : null,
      ground_contact_ms: $('fGct').value ? parseInt($('fGct').value,10) : null,
      rpe: $('fRpe').value ? parseInt($('fRpe').value,10) : null,
      memo: $('fMemo').value.trim() || null
    };
    $('submitBtn').disabled = true;
    try{
      if(editing){
        await Backend.updateRecord(editing.id, data);
        state.editingRecord = null;
        openMyPage();
        return;
      }
      await Backend.addRecord(state.user.id, data);
      var ws = weekStartStr();
      var mine = await Backend.listMyRecords(state.user.id).catch(function(){ return []; });
      var wk = mine.filter(function(r){ return r.date >= ws; });
      var wkKm = wk.reduce(function(a,r){ return a + Number(r.distance_km||0); }, 0);
      showMsg('inputMsg','ok','記録を保存しました。今週 '+wkKm.toFixed(1)+'km（'+wk.length+'本）です。');
      ['fDist','fDuration','fPace','fHr','fRpe','fMemo'].forEach(function(id){ $(id).value=''; });
      $('fDate').value = todayStr();
    }catch(e){
      showMsg('inputMsg','err','保存に失敗しました：'+e.message);
    }
    if($('submitBtn')) $('submitBtn').disabled = false;
  };
}

function recordsTableHtml(records, withActions){
  if(!records.length) return '<div class="empty">まだ記録がありません。</div>';
  var cols = 7;
  return '<table class="recTable"><thead><tr><th>日付</th><th class="num">距離</th><th class="num">時間</th><th class="num">ペース</th><th class="num">心拍</th><th class="num">RPE</th><th></th></tr></thead><tbody>'
    + records.map(function(r){
        var detailId = 'rd-' + r.id;
        var extra = [];
        if(r.cadence != null) extra.push('ピッチ ' + r.cadence + ' spm');
        if(r.ground_contact_ms != null) extra.push('接地時間 ' + r.ground_contact_ms + ' ms');
        var detailBody = extra.join(' ・ ')
          + (r.memo ? (extra.length ? '<br>' : '') + '💬 ' + esc(r.memo) : '')
          || 'ピッチ・接地時間・メモの入力はありません。';
        return '<tr class="recRow">'
          + '<td class="cDate">'+esc(r.date.slice(5).replace('-','/'))+'</td>'
          + '<td class="num cDist">'+Number(r.distance_km).toFixed(2)+'<span class="unit"> km</span></td>'
          + '<td class="num cSub" data-label="時間">'+esc(r.duration_text)+'</td>'
          + '<td class="num cSub" data-label="ペース">'+esc(r.pace_text)+'</td>'
          + '<td class="num cSub" data-label="心拍">'+esc(r.heart_rate)+'</td>'
          + '<td class="num cSub" data-label="RPE">'+(r.rpe||'—')+'</td>'
          + '<td class="cActions">'
          +   '<button class="ghost tiny" data-rowdetail="'+esc(detailId)+'">詳細</button>'
          +   (withActions ? ' <button class="ghost tiny" data-edit="'+esc(r.id)+'">編集</button> <button class="ghost tiny" data-del="'+esc(r.id)+'">削除</button>' : '')
          + '</td>'
          + '</tr>'
          + '<tr class="detailRow" id="'+esc(detailId)+'" style="display:none">'
          +   '<td colspan="'+cols+'" style="color:var(--muted);font-size:12.5px">'+detailBody+'</td>'
          + '</tr>';
      }).join('')
    + '</tbody></table>';
}

function monthLabel(key){
  var parts = key.split('-');
  return parts[0] + '年' + parseInt(parts[1], 10) + '月';
}

function renderMonthlyRecords(containerEl, records, withActions, onChange){
  var byMonth = {};
  records.forEach(function(r){
    var k = r.date.slice(0, 7);
    (byMonth[k] = byMonth[k] || []).push(r);
  });
  var months = Object.keys(byMonth).sort().reverse();
  if(!months.length){
    containerEl.innerHTML = '<div class="empty">まだ記録がありません。</div>';
    return;
  }
  var current = months[0];

  function draw(){
    var recs = byMonth[current].slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var total = recs.reduce(function(a,r){ return a + Number(r.distance_km||0); }, 0);
    containerEl.innerHTML =
      '<div class="monthTabs">' + months.map(function(k){
        return '<button type="button" class="monthTab'+(k===current?' active':'')+'" data-month="'+k+'">'+monthLabel(k)+'</button>';
      }).join('') + '</div>'
      + '<div class="monthSummary">'+monthLabel(current)+'の合計：<b>'+total.toFixed(1)+' km</b>（'+recs.length+'件）</div>'
      + recordsTableHtml(recs, withActions);

    containerEl.querySelectorAll('.monthTab').forEach(function(btn){
      btn.onclick = function(){ current = btn.dataset.month; draw(); };
    });

    containerEl.querySelectorAll('[data-rowdetail]').forEach(function(btn){
      btn.onclick = function(){
        var row = $(btn.dataset.rowdetail);
        if(!row) return;
        var showing = row.style.display !== 'none';
        row.style.display = showing ? 'none' : 'table-row';
        btn.textContent = showing ? '詳細' : '閉じる';
      };
    });

    if(withActions){
      containerEl.querySelectorAll('[data-del]').forEach(function(btn){
        btn.onclick = async function(){
          if(!confirm('この記録を削除しますか？')) return;
          await Backend.deleteRecord(btn.dataset.del);
          if(onChange) onChange();
        };
      });
      containerEl.querySelectorAll('[data-edit]').forEach(function(btn){
        btn.onclick = function(){
          var rec = records.find(function(r){ return r.id === btn.dataset.edit; });
          if(!rec) return;
          state.editingRecord = rec;
          state.tab = 'input';
          render();
        };
      });
    }
  }
  draw();
}

function relDateLabel(dateStr){
  var d = Math.floor((new Date(todayStr()) - new Date(dateStr)) / 86400000);
  var md = esc(dateStr.slice(5).replace('-', '/'));
  if(d === 0) return md + '（今日）';
  if(d === 1) return md + '（昨日）';
  return md + '（' + d + '日前）';
}

    + '</section>';

  $('backToTeam').onclick = function(){
    state.viewMember = null;
    renderOverviewTab(el);
  };

  var recs = await Backend.listMyRecords(target.id).catch(function(){ return []; });
  var thisMonth = currentMonthKey();
  var sum = function(list){ return list.reduce(function(a, r){ return a + Number(r.distance_km||0); }, 0); };
  var monthKm = sum(recs.filter(function(r){ return r.date.slice(0,7) === thisMonth; }));

  $('memberSummary').innerHTML =
      '<div class="grid g2">'
    +   '<div><label>今月</label><div style="font-size:22px;font-weight:800">'+monthKm.toFixed(1)+'<small style="font-size:13px;color:var(--muted)"> km</small></div></div>'
    +   '<div><label>これまでの合計</label><div style="font-size:22px;font-weight:800">'+sum(recs).toFixed(1)+'<small style="font-size:13px;color:var(--muted)"> km</small></div></div>'
    + '</div>'
    + '<p class="note" style="margin-top:10px">記録 '+recs.length+'件'
    +   (recs.length ? ' ／ 最終記録 '+relDateLabel(recs[0].date) : '')
    + '</p>';

  // 自分のページだけ編集・削除ボタンを付ける
  renderMonthlyRecords($('memberRecords'), recs, isMe, isMe ? function(){ renderMemberDetail(el); } : null);
}

/* ---------------- ルート描画 ---------------- */
function render(){
  renderShell();
}

boot();
})();
</script>
</body>
</html>
